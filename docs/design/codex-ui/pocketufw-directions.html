};
const models = {};
const initial = window.openai?.widgetState?.privateContent || {};
function nav(d){
  const m=models[d], tide=d==='tide', route=m.route;
  const items=tide?[['home','circle-power','Firewall'],['counters','list-filter','Activity'],['settings','sliders-horizontal','Settings']]:[['home','circle-power','Firewall'],['counters','scan-line','Inspect']];

function subnav(m){return `<div class="subnav" aria-label="Inspection views"><button type="button" data-route="counters" aria-pressed="${m.route==='counters'}">Counters</button><button type="button" data-route="rules" aria-pressed="${m.route==='rules'}">Kernel rules</button></div>`}
function policies(active){return `<div class="policy-list"><div class="policy-row">${icons('arrow-down-to-line')}<strong>Unsolicited incoming</strong><span>${active?'Blocked':'Not verified'}</span></div><div class="policy-row">${icons('arrow-up-right')}<strong>Outgoing</strong><span>Unchanged</span></div></div>`}
function home(d){
 const m=models[d], s=states[m.state], active=m.state==='ACTIVE';

 const count=m.reset?'0':'1,284';
 if(d==='tide')return `<div class="page hero"><div class="verification" role="status">${icons(s.icon)}${s.verification}</div><div class="headline"><h1>${s.title}</h1><img class="mascot" src="${mascot}" alt=""></div><div class="boundary" aria-hidden="true"></div><p class="hero-copy">${s.copy}</p><button type="button" class="primary" data-action="power" ${isBusy?'disabled':''}>${icons(active?'power':s.icon)}${s.action}</button>${m.state==='DEGRADED'?`<button type="button" class="text-action" data-route="rules">Inspect partial rules ${icons('arrow-right')}</button><button type="button" class="secondary" data-action="remove">Remove partial PocketUFW rules</button>`:''}${policies(active)}${active?`<button type="button" class="counter-link" data-route="counters"><div><span class="count">${count}</span><span class="counter-caption">Dropped packets · kernel counters</span></div>${icons('arrow-up-right')}</button><button type="button" class="inline-action" data-route="settings"><div>Restore after reboot<span class="sub">${m.boot?'On':'Off'} · Magisk</span></div>${icons('chevron-right')}</button>`:`<p class="${m.state==='CHECKING'?'pending-note':'warning'}">${m.state==='INACTIVE'?'Turn on the firewall to read PocketUFW counters.':m.state==='ROOT_REQUIRED'?'Root access is required to read or change firewall rules.':'Counters are unavailable until protection is verified.'}</p>`}<div class="footer-note">${icons('terminal')}<span>${m.state==='ROOT_REQUIRED'?'Root access not granted':m.state==='CHECKING'?'Reading root access':'Root access granted'} · Beta 4</span></div></div>`;

}
function counters(d){
 const m=models[d], z=m.reset, active=m.state==='ACTIVE';
 if(d==='relay'&&active)return `<div class="page"><div class="page-title"><h1>Inspect</h1></div>${subnav(m)}<div class="instrument-total"><div><strong class="mono">${z?'0':'1,284'}</strong><span>Total packets dropped</span></div><div><strong class="mono" style="font-size:1.25em;letter-spacing:-1px">${z?'0 B':'92.1 KiB'}</strong><span>Total bytes dropped</span></div></div>${[['IPv4','1,196','84.3 KiB','21,348'],['IPv6','88','7.8 KiB','1,342']].map(([family,packets,bytes,replies])=>`<section class="family-ledger" aria-label="${family} counters"><h2>${family}</h2><div><div class="ledger-line"><span>Dropped</span><strong>${z?'0':packets}</strong></div><div class="ledger-line"><span>Bytes dropped</span><strong>${z?'0 B':bytes}</strong></div><div class="ledger-line"><span>Replies accepted</span><strong>${z?'0':replies}</strong></div></div></section>`).join('')}<div class="timestamp">LAST READ · 09:41:06${z?'<br>LAST MANUAL RESET · 09:41':''}</div><div class="actions"><button type="button" class="primary" data-action="refresh">${icons('refresh-cw')}Refresh</button><button type="button" class="secondary" data-action="reset">Reset counters</button></div><p class="tiny spaced">Replies: established / related packets. These are rule matches, not detected attacks.</p><p class="tiny spaced">Updated when opened or refreshed. Counts reset on request or when rules are reinstalled.</p></div>`;
 return `<div class="page"><div class="page-title"><h1>${d==='tide'?'Activity.':'Inspect'}</h1></div>${subnav(m)}${!active?`<div class="warning">Counters unavailable · ${states[m.state].label.toLowerCase()}. A verified measurement is required.</div><button type="button" class="secondary" data-action="recheck">Recheck status</button>`:`<div class="counter-total"><span class="eyebrow muted">Incoming packets dropped</span><div class="row"><span class="value">${z?'0':'1,284'}</span><span class="bytes mono">${z?'0 B':'92.1 KiB'}</span></div></div><table class="counter-table"><thead><tr><th>Family</th><th>Dropped</th><th>Bytes</th></tr></thead><tbody><tr><td>IPv4</td><td class="mono">${z?'0':'1,196'}</td><td class="mono">${z?'0 B':'84.3 KiB'}</td></tr><tr><td>IPv6</td><td class="mono">${z?'0':'88'}</td><td class="mono">${z?'0 B':'7.8 KiB'}</td></tr></tbody></table><div class="replies"><div><h3>Replies accepted</h3><p>Established / related packets</p></div><strong>${z?'0':'22,690'}</strong></div><details><summary>Reply counts by address family</summary><div class="port-row"><span>IPv4</span><span class="mono">${z?'0':'21,348'}</span></div><div class="port-row"><span>IPv6</span><span class="mono">${z?'0':'1,342'}</span></div></details><div class="timestamp">LAST READ · 09:41:06${z?'<br>LAST MANUAL RESET · 09:41':''}</div><div class="actions"><button type="button" class="primary" data-action="refresh">${icons('refresh-cw')}Refresh</button><button type="button" class="secondary" data-action="reset">Reset counters</button></div><p class="tiny spaced">Rule matches, not attack detections. Counts reset on request or when rules are reinstalled.</p><p class="tiny spaced">Updated when opened or refreshed. No continuous monitoring.</p>`}</div>`;
}
const ruleNames4=[['Established / related replies','ALLOW'],['Invalid packets','DROP'],['ICMP control traffic','ALLOW'],['DHCP replies','ALLOW'],['Multicast DNS','ALLOW'],['ESP / IPsec','ALLOW'],['VPN listener exceptions','CHECK'],['Other incoming packets','DROP']];
const ruleNames6=[['Established / related replies','ALLOW'],['Invalid packets','DROP'],['ICMPv6 control traffic','ALLOW'],['DHCPv6 replies','ALLOW'],['Multicast DNS','ALLOW'],['ESP / IPsec','ALLOW'],['VPN listener exceptions','CHECK'],['Other incoming packets','DROP']];
function rawRules(m){return `-P INPUT ACCEPT\n-A INPUT -i wlan+ -j POCKETUFW_IN\n-A INPUT -i rmnet+ -j POCKETUFW_IN\n-A INPUT -i v4-rmnet+ -j POCKETUFW_IN\n\n-A POCKETUFW_IN -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n-A POCKETUFW_IN -m conntrack --ctstate INVALID -j DROP\n-A POCKETUFW_IN -p ${m.family==='IPv4'?'icmp':'ipv6-icmp'} -j ACCEPT\n-A POCKETUFW_IN -p udp --sport ${m.family==='IPv4'?'67 --dport 68':'547 --dport 546'} -j ACCEPT\n-A POCKETUFW_IN -p udp --dport 5353 -j ACCEPT\n-A POCKETUFW_IN -p esp -j ACCEPT\n-A POCKETUFW_IN -j POCKETUFW_TS\n-A POCKETUFW_IN -j DROP\n\n-A POCKETUFW_TS -p udp --dport 41641 -j ACCEPT`}
function rules(d){
 const m=models[d], list=m.family==='IPv4'?ruleNames4:ruleNames6;
 return `<div class="page"><div class="page-title compact-title"><h1>Kernel rules${d==='tide'?'.':''}</h1></div>${subnav(m)}<div class="family-tabs"><button type="button" data-family="IPv4" aria-pressed="${m.family==='IPv4'}">IPv4</button><button type="button" data-family="IPv6" aria-pressed="${m.family==='IPv6'}">IPv6</button><button type="button" class="text-action" data-action="raw">${icons(m.raw?'list':'code-xml')}${m.raw?'Readable':'Raw'}</button></div>${m.state!=='ACTIVE'?`<div class="warning">${m.state==='INACTIVE'?'No PocketUFW rules are installed.':'Complete rule report unavailable. Recheck before relying on the detailed policy.'}</div>`:`<div class="rule-context"><div class="row"><h3>INPUT <span class="muted">/ filter</span></h3><span class="tiny accent">Read 09:41</span></div><p>Android default: <strong>ACCEPT</strong> · unchanged</p><p class="mono">Hooks: wlan+ · rmnet+ · v4-rmnet+</p></div>${m.raw?`<pre aria-label="Raw kernel rules">${rawRules(m)}</pre>`:`<div class="row spaced"><span class="eyebrow muted">PocketUFW · kernel order</span></div><ol class="rule-list">${list.map(([n,a],i)=>`<li class="${a==='DROP'?'drop':''}"><span class="rule-no">${String(i+1).padStart(2,'0')}</span><span class="rule-name">${n}</span><span class="rule-action">${a}</span></li>`).join('')}</ol>`}`}<button type="button" class="inline-action" data-route="exceptions"><span>VPN UDP exceptions</span>${icons('arrow-up-right')}</button><p class="tiny spaced">Read-only snapshot. Earlier Android/OEM rules may accept traffic before these hooks. Other interfaces may bypass PocketUFW.</p></div>`;
}
function settings(d){
 const m=models[d];
 return `<div class="page"><div class="page-title"><h1>${d==='tide'?'Settings.':'Setup'}</h1><p>Small controls. Clear boundaries.</p></div><div class="settings-group"><div class="eyebrow">Startup</div><div class="setting-row"><div class="grow"><h3>Restore after reboot</h3><p>Uses Magisk at startup.<br>No background app.</p></div><button type="button" class="switch" data-action="boot" role="switch" aria-label="Restore after reboot" aria-checked="${m.boot}" ${m.state!=='ACTIVE'?'disabled':''}></button></div>${m.state!=='ACTIVE'?'<p class="tiny spaced">Available when the firewall is active and Magisk restoration is supported.</p>':''}</div><div class="settings-group"><div class="eyebrow">Connections</div><button type="button" class="inline-action" data-route="exceptions"><div>VPN UDP exceptions<span class="sub">${m.mode==='Committed'?'Committed · saved ports':'Automatic · verified Tailscale listeners'}</span></div>${icons('chevron-right')}</button><div class="setting-row"><div class="grow"><h3>VPN connection</h3><p>Detected by Android</p></div><span class="tiny accent">Connected</span></div><button type="button" class="text-action" data-action="vpn" ${m.state!=='ACTIVE'?'disabled':''}>${icons('refresh-cw')}Refresh VPN exceptions</button></div><div class="settings-group"><div class="eyebrow">Quick access</div><button type="button" class="inline-action" data-action="tile"><div>Quick Settings tile<span class="sub">Enable or disable from Android’s shade</span></div>${icons('grid-2x2')}</button></div><div class="warning"><strong>Experimental build · Beta 4</strong><br>For test devices. Automatic repair and VPN monitoring are not implemented.</div><p class="tiny spaced">Local only · No accounts or telemetry<br>Kernel protection continues when this app closes.</p></div>`;
}
function exceptions(d){
 const m=models[d];
 return `<div class="page"><div class="page-title"><h1>UDP<br>exceptions${d==='tide'?'.':''}</h1><p>Allow a listener through incoming rules.</p></div><div class="verification" role="status">${icons('route')}${m.mode==='Committed'?'Committed · saved ports':'Automatic · Tailscale'}</div><p class="spaced">Narrow exceptions can help Tailscale peers connect directly. Ordinary outbound VPN connections usually do not need them.</p><div class="port-row spaced"><div>IPv4<span class="port-label">Live incoming UDP port</span></div><span class="mono">41641</span></div><div class="port-row"><div>IPv6<span class="port-label">Live incoming UDP port</span></div><span class="mono">41641</span></div><p class="tiny spaced">An allowed UDP port accepts packets from any source on supported interfaces, not only Tailscale.</p><button type="button" class="primary spaced" data-action="edit-warning" ${m.state!=='ACTIVE'?'disabled':''}>Edit exceptions</button><button type="button" class="text-action" data-action="vpn" ${m.state!=='ACTIVE'?'disabled':''}>${icons('refresh-cw')}Refresh VPN</button><button type="button" class="secondary" data-action="automatic" ${m.state!=='ACTIVE'?'disabled':''}>Reset to automatic</button><p class="tiny spaced">Refresh VPN does not overwrite Committed ports. Manual ports can become stale when a listener changes.</p></div>`;
}
function editor(d){
 const m=models[d];
 return `<div class="page"><div class="page-title"><h1>Edit ports${d==='tide'?'.':''}</h1><p>One incoming UDP port per family.<br>Leave blank for none.</p></div><label class="field">IPv4 UDP port<input inputmode="numeric" maxlength="5" name="ipv4" value="41641" placeholder="None"></label><label class="field">IPv6 UDP port<input inputmode="numeric" maxlength="5" name="ipv6" value="41641" placeholder="None"></label><label class="radio"><input type="radio" name="mode-${d}" value="Experimental" ${m.mode!=='Committed'?'checked':''}><span>Experimental<small>Temporary. Resets on firewall off/on or reboot. Refresh VPN may replace it. Closing the app does not reset it.</small></span></label><label class="radio"><input type="radio" name="mode-${d}" value="Committed" ${m.mode==='Committed'?'checked':''}><span>Committed<small>Saved until edited or reset to automatic. Reapplied at startup, including reboot when Magisk restoration is enabled.</small></span></label><div class="actions spaced"><button type="button" class="secondary" data-route="exceptions">Cancel</button><button type="button" class="primary" data-action="save">${m.mode==='Committed'?'Review save':'Apply now'}</button></div></div>`;
}
function dialog(d){
 const m=models[d];
 if(!m.dialog)return '';
 const dialogs={warning:['Advanced firewall configuration','Editing incoming UDP exceptions can expose services or break VPN connectivity. Only change ports you understand.','I understand','accept-warning'],commit:['Commit these UDP exceptions?','These ports will replace automatic Tailscale exceptions for future firewall sessions, until you edit them or reset to automatic.','Yes, commit','commit'],automatic:['Reset to automatic?','Replace current UDP exceptions with ports verified from running Tailscale listeners. This also clears saved manual ports.','Reset exceptions','do-automatic'],tile:['Quick Settings','Open Android’s Quick Settings editor and add PocketUFW. The existing shield tile shows firewall state and lets you enable or disable it.','Done','close']};
 const [title,copy,confirm,action]=dialogs[m.dialog];
 return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p>${copy}</p><div class="actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="button" class="primary" data-action="${action}">${confirm}</button></div></div></div>`;
}
function persist(){if(window.openai?.setWidgetState){const saved={};for(const [d,m] of Object.entries(models))saved[d]={state:m.state,route:m.route,family:m.family,raw:m.raw,fontScale:m.fontScale};window.openai.setWidgetState({modelContent:{directions:['Tide','Relay']},privateContent:saved}).catch(()=>{});}}
function render(d,keepScroll=false){
 const m=models[d], el=m.el, previous=el.querySelector('.body')?.scrollTop||0;
 el.style.setProperty('--scale',m.fontScale);el.dataset.state=m.state;el.dataset.large=m.fontScale>1.2;
 const sub=['exceptions','editor'].includes(m.route)||d==='relay'&&m.route==='settings';
 const content=({home,counters,rules,settings,exceptions,editor})[m.route](d);
 el.innerHTML=`<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="system-icons">${icons('signal')}${icons('wifi')}${icons('battery-full')}</span></div><header class="appbar">${sub?`<button type="button" data-action="back" aria-label="Go back">${icons('arrow-left')}</button>`:d==='relay'?`<div class="brand-mascot"><img src="${mascot}" alt=""></div>`:''}<span class="wordmark">Pocket<span>UFW</span></span>${d==='relay'?(['counters','rules'].includes(m.route)?`<button type="button" data-action="${m.route==='rules'?'recheck':'refresh'}" aria-label="${m.route==='rules'?'Recheck kernel rules':'Refresh counters'}">${icons('refresh-cw')}</button>`:`<button type="button" data-route="settings" aria-label="Settings">${icons('sliders-horizontal')}</button>`):`<button type="button" data-action="recheck" aria-label="Recheck firewall status">${icons("refresh-cw")}</button>`}</header><main class="body" aria-label="${m.route}">${content}</main>${nav(d)}${m.toast?`<div class="toast" role="status">${m.toast}</div>`:''}${dialog(d)}`;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});
 if(keepScroll)el.querySelector('.body').scrollTop=previous;
 if(m.dialog){for(const child of el.children)if(!child.classList.contains('overlay'))child.inert=true;el.querySelector('.sheet button')?.focus();}
}
for(const el of root.querySelectorAll('.pufw-phone')){
 const d=el.dataset.design, saved=initial[d]||{};
 models[d]={el,state:'ACTIVE',route:'home',family:'IPv4',raw:false,fontScale:1,boot:true,reset:false,mode:'Automatic',dialog:null,toast:null,...saved};
 if(!states[models[d].state])models[d].state='ACTIVE';
 if(!['home','counters','rules','settings','exceptions','editor'].includes(models[d].route))models[d].route='home';
 const m=models[d];
 render(d);
 el.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button||button.disabled)return;
  m.toast=null;
  if(button.dataset.route){m.route=button.dataset.route;render(d);persist();return;}
  if(button.dataset.family){m.family=button.dataset.family;render(d);persist();return;}
  const a=button.dataset.action;
  if(a==='power'){if(m.state==='ACTIVE')m.state='INACTIVE';else if(m.state==='INACTIVE')m.state='ACTIVE';else m.toast='Preview only · select a state with the design controls.';}
  if(a==='raw')m.raw=!m.raw;
  if(a==='remove')m.state='INACTIVE';
  if(a==='reset'){m.reset=true;m.toast='Preview · counters reset. Firewall remains active.';}
  if(a==='refresh')m.toast='Preview · sample snapshot refreshed. No live device connected.';
  if(a==='recheck')m.toast='Preview · kernel recheck. No live device connected.';
  if(a==='vpn')m.toast=m.mode==='Committed'?'Committed ports are preserved.':'Preview · verified Tailscale listener ports refreshed.';
  if(a==='boot')m.boot=!m.boot;
  if(a==='back')m.route=m.route==='editor'?'exceptions':d==='relay'?'home':'settings';
  if(a==='edit-warning')m.dialog='warning';
  if(a==='automatic')m.dialog='automatic';
  if(a==='tile')m.dialog='tile';
  if(a==='close')m.dialog=null;
  if(a==='accept-warning'){m.dialog=null;m.route='editor';m.mode='Experimental';}
  if(a==='save'){
    const values=Array.from(el.querySelectorAll('input[inputmode=numeric]')).map(e=>e.value.trim());
    if(values.some(v=>v&&!/^\d{1,5}$/.test(v)||v&&(Number(v)<1||Number(v)>65535))){m.toast='Enter a UDP port from 1 to 65535, or leave blank for none.';}
    else if(m.mode==='Committed')m.dialog='commit';else{m.route='exceptions';m.toast='Preview · Experimental ports applied to this session.';}
  }
  if(a==='commit'){m.dialog=null;m.route='exceptions';m.toast='Preview · Committed ports saved.';}
  if(a==='do-automatic'){m.dialog=null;m.mode='Automatic';m.toast='Preview · automatic VPN exceptions restored.';}
  render(d,['raw','reset','refresh','recheck','vpn','boot'].includes(a));persist();
 });
 el.addEventListener('change',event=>{if(event.target.type==='radio'){m.mode=event.target.value;const b=el.querySelector('[data-action=save]');b.textContent=m.mode==='Committed'?'Review save':'Apply now';}});
 el.addEventListener('keydown',event=>{if(event.key==='Escape'&&m.dialog){m.dialog=null;render(d);}});
 if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:()=>{m.toast=null;render(d);persist();}});tweak.addSelect(m,'state',{label:'Firewall state',options:Object.keys(states)});tweak.addSlider(m,'fontScale',{label:'Text scale',min:1,max:1.6,step:.1});}
}
root.addEventListener('pufw-preview',event=>{const {design,...changes}=event.detail;if(models[design]){Object.assign(models[design],changes);render(design);}});
})();
</script>
